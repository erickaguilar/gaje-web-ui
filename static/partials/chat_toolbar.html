<!-- Barra Principal Superior Unificada GAJE (Apple HIG / Scandinavian Y2K) -->
<div class="chat-toolbar-primary-row">
    <div class="chat-toolbar-left">
        <div class="chat-window-mac-dots" aria-label="Controles de ventana">
            <button type="button" class="traffic-dot dot-close" id="win-btn-close" data-tooltip="Borrar conversación y reiniciar" aria-label="Borrar conversación y reiniciar"></button>
            <button type="button" class="traffic-dot dot-min" id="win-btn-min" data-tooltip="Minimizar / Restaurar Ventana" aria-label="Minimizar / Restaurar Ventana"></button>
            <button type="button" class="traffic-dot dot-max" id="win-btn-max" data-tooltip="Pantalla Completa (Maximizar)" aria-label="Maximizar Ventana"></button>
        </div>

        <div class="toolbar-brand-title" aria-label="GAJE Helix">
            <svg class="y2k-icon-inline"><use href="static/icons/y2k/sprite.svg#i-dna"/></svg>
            <span>GAJE HELIX</span>
        </div>
    </div>

    <!-- Acciones Derecha (Botón de Telemetría HUD + Menú Desplegable) -->
    <div class="chat-toolbar-actions">
        <!-- Botón Directo de Telemetría HUD -->
        <button id="y2k-open-monitor-btn" class="chat-header-icon-btn" data-tooltip="Dashboard de Telemetría (HUD)" data-tooltip-pos="left" aria-label="Abrir Dashboard de Telemetría">
            <svg class="y2k-icon" aria-hidden="true"><use href="static/icons/y2k/sprite.svg#i-monitor"/></svg>
        </button>

        <!-- Menú Desplegable de Herramientas y Acciones (•••) -->
        <div class="chat-overflow-menu-container">
            <button id="chat-overflow-menu-btn" class="chat-header-icon-btn" aria-haspopup="true" aria-expanded="false" data-tooltip="Herramientas y Acciones" data-tooltip-pos="left" aria-label="Más opciones del chat">
                <svg class="y2k-icon" aria-hidden="true"><use href="static/icons/y2k/sprite.svg#i-dots"/></svg>
            </button>

            <!-- Dropdown flotante Apple HIG / Scandinavian con Modelo, Motor, Historial & Memoria -->
            <div id="chat-actions-dropdown" class="chat-menu-dropdown" role="menu" hidden>
                <!-- 1. Selector de Modelo Activo y Motor de Ejecución (Layout Vertical Apilado) -->
                <div class="menu-section-label">Organismo y Motor</div>
                <div class="menu-config-card">
                    <!-- Bloque Modelo -->
                    <div class="config-stacked-block">
                        <div class="config-stacked-header">
                            <label for="model-select" class="config-stacked-label">
                                <svg class="y2k-icon"><use href="static/icons/y2k/sprite.svg#i-dna"/></svg>
                                <span>Organismo / Modelo</span>
                            </label>
                            <button type="button" id="model-toggle-btn" class="model-status-btn active" data-tooltip="Alternar estado (Activo / En pausa)" aria-label="Alternar Estado del Modelo">
                                <span class="status-dot-led"></span>
                                <span id="model-toggle-text">Activo</span>
                            </button>
                        </div>
                        <div class="config-stacked-control">
                            <select id="model-select" class="menu-stacked-select header-model-dropdown" aria-label="Seleccionar Modelo">
                                <option value="max_512_pro.gaje" selected>GAJE Max Pro 512 · [208MB D=512]</option>
                                <option value="max.gaje">GAJE Max · [Insignia 99MB GTOK]</option>
                            </select>
                        </div>
                    </div>

                    <!-- Bloque Motor -->
                    <div class="config-stacked-block">
                        <div class="config-stacked-header">
                            <label for="engine-mode-select" class="config-stacked-label">
                                <svg class="y2k-icon"><use href="static/icons/y2k/sprite.svg#i-bolt"/></svg>
                                <span>Motor de Inferencia</span>
                            </label>
                        </div>
                        <div class="config-stacked-control">
                            <select id="engine-mode-select" class="menu-stacked-select" aria-label="Modo de Ejecución">
                                <option value="native" selected>Servidor (Nativo Rust AVX2 / Cloud)</option>
                                <option value="wasm">Navegador (WASM In-Browser / Offline)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Bloque Temperatura -->
                    <div class="config-stacked-block">
                        <div class="config-stacked-header">
                            <label for="temperature-slider" class="config-stacked-label">
                                <svg class="y2k-icon"><use href="static/icons/y2k/sprite.svg#i-sparkle"/></svg>
                                <span>Temperatura (<span id="temperature-val">0.3</span>)</span>
                            </label>
                        </div>
                        <div class="config-stacked-control" style="display: flex; align-items: center; gap: 8px;">
                            <input type="range" id="temperature-slider" min="0.0" max="1.0" step="0.05" value="0.3" class="menu-stacked-slider" aria-label="Ajustar Temperatura" style="flex: 1; accent-color: var(--accent, #0a84ff); cursor: pointer;">
                        </div>
                    </div>
                </div>

                <div class="menu-divider"></div>

                <!-- 2. Conversación -->
                <div class="menu-section-label">Conversación</div>
                <button id="export-log-btn" class="chat-menu-item" role="menuitem" data-tooltip="Generar y descargar reporte de auditoría en Markdown (.md)">
                    <svg class="y2k-icon"><use href="static/icons/y2k/sprite.svg#i-docs"/></svg>
                    <span>Exportar Bitácora (.md)</span>
                </button>

                <button id="clear-history-btn" class="chat-menu-item danger" role="menuitem" data-tooltip="Borrar todos los mensajes del chat y reiniciar memoria">
                    <svg class="y2k-icon"><use href="static/icons/y2k/sprite.svg#i-trash"/></svg>
                    <span>Borrar Historial</span>
                </button>

                <div class="menu-divider"></div>

                <!-- 3. Gestión de Memoria y Pesos -->
                <div class="menu-section-label">Gestión de Memoria</div>
                <button id="load-local-flat-btn" class="chat-menu-item" role="menuitem" data-tooltip="Cargar e inferir un archivo binario genómico .gaje desde tu disco local">
                    <svg class="y2k-icon"><use href="static/icons/y2k/sprite.svg#i-import"/></svg>
                    <span>Cargar Modelo .gaje Local...</span>
                </button>
                <input type="file" id="local-flat-file-input" accept=".gaje,.flat" style="display: none;">

                <button id="unload-model-btn" class="chat-menu-item warning" role="menuitem" data-tooltip="Desasignar tensores y reducir el consumo de RAM a 0 MB (reposo)">
                    <svg class="y2k-icon"><use href="static/icons/y2k/sprite.svg#i-unload"/></svg>
                    <span>Liberar Memoria RAM</span>
                </button>

                <button id="stop-all-models-btn" class="chat-menu-item danger" role="menuitem" data-tooltip="Parada de emergencia: Abortar inferencia activa, apagar workers y purgar la memoria RAM">
                    <svg class="y2k-icon"><use href="static/icons/y2k/sprite.svg#i-stop"/></svg>
                    <span>Detener Todos los Modelos</span>
                </button>

                <div class="menu-divider"></div>

                <!-- 4. Diagnóstico Móvil y Consola de Logs -->
                <div class="menu-section-label">Diagnóstico</div>
                <button type="button" id="chat-devconsole-btn" class="chat-menu-item" role="menuitem" onclick="if(window.toggleDevConsole) window.toggleDevConsole();" data-tooltip="Abrir consola de logs y depuración para dispositivos móviles">
                    <svg class="y2k-icon" style="color: #22d3ee;"><use href="static/icons/y2k/sprite.svg#i-terminal"/></svg>
                    <span>Consola Móvil (Logs)</span>
                </button>
            </div>
        </div>
    </div>
</div>
