<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="static/icons/gaje-icon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="description" content="GAJE Helix - Motor de inferencia nativo en Rust con compresión Q4_0 + FP32 (formato .gaje.flat v2 zero-copy mmap), Island Model .gmem y kernels SIMD de alto rendimiento.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GAJE Helix">
    <meta name="theme-color" content="#0a84ff">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="static/icons/gaje-icon.svg">
    <title>GAJE Helix | Genomic Semantic Compression Platform</title>
    <link rel="stylesheet" href="static/css/base.css?v=1.7.0-alpha">
    <link rel="stylesheet" href="static/css/chat.css?v=1.7.0-alpha">
    <link rel="stylesheet" href="static/css/y2k-dark.css?v=1.7.0-alpha">
    <link rel="stylesheet" href="static/css/y2k-light.css?v=1.7.0-alpha">
    <link rel="stylesheet" href="static/css/y2k-zen.css?v=1.7.0-alpha">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);

            // 🧬 Consola Móvil DevTools GAJE para Android
            window.gajeDevLogs = [];
            const pushEntry = (type, args) => {
                const text = Array.from(args).map(a => {
                    if (a instanceof Error) return `${a.name}: ${a.message}\n${a.stack || ''}`;
                    if (typeof a === 'object') {
                        try { return JSON.stringify(a, null, 2); } catch (_) { return String(a); }
                    }
                    return String(a);
                }).join(' ');
                window.gajeDevLogs.push({ type, time: new Date().toLocaleTimeString(), text });
                if (window.gajeDevLogs.length > 300) window.gajeDevLogs.shift();
                if (window.renderDevLogs) window.renderDevLogs();
            };

            const _log = console.log, _warn = console.warn, _err = console.error;
            console.log = function(...a) { pushEntry('info', a); _log.apply(console, a); };
            console.warn = function(...a) { pushEntry('warn', a); _warn.apply(console, a); };
            console.error = function(...a) { pushEntry('error', a); _err.apply(console, a); };

            window.onerror = function(msg, url, line, col, err) {
                const src = url ? url.split('/').pop() : 'inline';
                pushEntry('error', [`[CRASH ${src}:${line}:${col}] ${msg}`]);
            };
            window.addEventListener('unhandledrejection', function(e) {
                pushEntry('error', [`[PROMISE ERROR] ${e.reason}`]);
            });
        })();
    </script>
</head>
<body>
    <div class="glow-bg-radial" aria-hidden="true"></div>
    <header id="gaje-header" class="y2k-header" data-page="chat"></header>
    <div class="app-container">
        <main>
            <!-- ──────────────────────────── CHAT (PANTALLA COMPLETA) ──────────────────────────── -->
            <section id="chat-view" class="chat-container" aria-label="Consola de Chat Genómico" aria-busy="false">
                <!-- Barra de Herramientas Modular (Cargada desde static/partials/chat_toolbar.html) -->
                <div id="chat-toolbar" class="chat-toolbar"></div>
                <div id="chat-window" class="chat-window" role="log" aria-live="polite" aria-relevant="additions" aria-labelledby="chat-label">
                    <!-- Sugerencias Rápidas de Prompt (Formato Lista Compacta) -->
                    <div id="chat-starters" class="chat-starters">
                        <div class="starters-header">
                            <span class="starters-badge"><svg class="y2k-icon-inline"><use href="static/icons/y2k/sprite.svg#i-sparkle"/></svg> PREGUNTAS RÁPIDAS</span>
                        </div>
                        <ul class="starters-list" role="list">
                            <li>
                                <button class="starter-card starter-list-item" data-prompt="¿Quién eres y qué puedes hacer?">
                                    <svg class="y2k-icon starter-icon"><use href="static/icons/y2k/sprite.svg#i-bolt"/></svg>
                                    <span class="starter-text">¿Quién eres y qué puedes hacer?</span>
                                    <span class="starter-arrow" aria-hidden="true">→</span>
                                </button>
                            </li>
                            <li>
                                <button class="starter-card starter-list-item" data-prompt="Explica en pocas palabras qué es la compresión semántica.">
                                    <svg class="y2k-icon starter-icon"><use href="static/icons/y2k/sprite.svg#i-dna"/></svg>
                                    <span class="starter-text">Explica en pocas palabras qué es la compresión semántica.</span>
                                    <span class="starter-arrow" aria-hidden="true">→</span>
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Botón Flotante para Bajar al Último Mensaje (Scroll to Bottom) -->
                <button id="scroll-to-bottom-btn" class="scroll-to-bottom-btn" aria-label="Bajar al último mensaje" title="Bajar al final" hidden>
                    <svg class="y2k-icon" aria-hidden="true"><use href="static/icons/y2k/sprite.svg#i-arrow-down"/></svg>
                </button>

                <!-- Input Composer Inteligente (Multi-línea + Barra de Estado) -->
                <div class="input-area">
                    <div class="composer-main-row">
                        <label for="user-input" class="visually-hidden">Mensaje para el modelo</label>
                        <textarea id="user-input" placeholder="Escribe un mensaje o consulta genómica..." rows="1" autocomplete="off" aria-label="Mensaje para el modelo"></textarea>
                        
                        <button id="stop-btn" class="composer-action-btn stop-btn" title="Detener generación" aria-label="Detener generación" hidden>
                            <svg class="y2k-icon"><use href="static/icons/y2k/sprite.svg#i-stop"/></svg>
                        </button>
                        
                        <button id="send-btn" class="composer-action-btn send-btn" title="Enviar mensaje (Enter)" aria-label="Enviar mensaje" disabled>
                            <svg class="send-icon y2k-icon" aria-hidden="true"><use href="static/icons/y2k/sprite.svg#i-send"/></svg>
                        </button>
                    </div>

                    <div class="composer-meta-bar">
                        <div class="composer-hint">
                            <span class="keycap">Enter</span> para enviar · <span class="keycap">Shift+Enter</span> nueva línea
                        </div>
                        <div class="composer-stats">
                            <span id="composer-model-tag" class="composer-model-badge"><svg class="y2k-icon-inline"><use href="static/icons/y2k/sprite.svg#i-dna"/></svg> <span id="composer-active-model-name">gaje-model</span></span>
                            <span class="composer-sep">·</span>
                            <span id="char-count" class="composer-char-count">0 car.</span>
                            <span class="composer-sep">·</span>
                            <span class="composer-status-badge"><svg class="y2k-icon-inline"><use href="static/icons/y2k/sprite.svg#i-bolt"/></svg> Rust Engine Listo</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <footer id="gaje-footer" class="y2k-footer"></footer>
    <script src="static/js/config.js"></script>
    <script src="static/js/storage.js"></script>
    <script src="static/js/ui.js"></script>

    <!-- Módulos de la Consola de Chat -->
    <script src="static/js/chat/state.js?v=1.7.2"></script>
    <script src="static/js/chat/utils.js?v=1.7.2"></script>
    <script src="static/js/chat/markdown.js?v=1.7.2"></script>
    <script src="static/js/chat/storage.js?v=1.7.2"></script>
    <script src="static/js/chat/toolbar.js?v=1.7.2"></script>
    <script src="static/js/chat/engine.js?v=1.7.2"></script>
    <script src="static/js/chat/composer.js?v=1.7.2"></script>
    <script src="static/js/chat/telemetry.js?v=1.7.2"></script>
    <script src="static/js/chat/index.js?v=1.7.2"></script>

    <!-- Consola Móvil DevTools Modal (Activada desde el menú del chat) -->

    <!-- Consola Móvil DevTools Modal Y2K (Activada desde toolbar o menú) -->
    <div id="mobile-devtools-modal" class="y2k-console-backdrop" style="display: none;" role="dialog" aria-modal="true" aria-label="Consola de Sistema y Diagnóstico" onclick="if(event.target===this) window.toggleDevConsole();">
        <div class="y2k-console-window">
            <div class="y2k-console-header">
                <div class="y2k-console-title-group">
                    <div class="y2k-console-traffic-dots">
                        <span class="console-dot dot-red" onclick="window.toggleDevConsole()" title="Cerrar consola"></span>
                        <span class="console-dot dot-yellow" onclick="window.clearDevLogs()" title="Limpiar logs"></span>
                        <span class="console-dot dot-green" onclick="window.copyDevLogs()" title="Copiar logs"></span>
                    </div>
                    <div class="y2k-console-title">
                        <svg class="y2k-icon-inline"><use href="static/icons/y2k/sprite.svg#i-terminal"/></svg>
                        <span>GAJE_CONSOLE // SYSTEM_DIAGNOSTICS</span>
                        <span class="brand-underscore">_</span>
                    </div>
                </div>
                <div class="y2k-console-actions">
                    <button type="button" class="y2k-bevel-btn" onclick="window.copyDevLogs()" title="Copiar logs al portapapeles">
                        <svg class="y2k-icon-micro"><use href="static/icons/y2k/sprite.svg#i-docs"/></svg>
                        <span>Copiar</span>
                    </button>
                    <button type="button" class="y2k-bevel-btn" onclick="window.clearDevLogs()" title="Limpiar todos los logs">
                        <svg class="y2k-icon-micro"><use href="static/icons/y2k/sprite.svg#i-trash"/></svg>
                        <span>Limpiar</span>
                    </button>
                    <button type="button" class="y2k-bevel-btn y2k-btn-cyan" onclick="window.injectEruda()" title="Inyectar consola Eruda completa">
                        <svg class="y2k-icon-micro"><use href="static/icons/y2k/sprite.svg#i-bolt"/></svg>
                        <span>Eruda</span>
                    </button>
                    <button type="button" class="y2k-bevel-btn y2k-btn-close" onclick="window.toggleDevConsole()" title="Cerrar">✕</button>
                </div>
            </div>
            <!-- Barra de Filtros Y2K -->
            <div class="y2k-console-filter-bar">
                <span class="filter-prompt">&gt; FILTRAR:</span>
                <button type="button" class="console-filter-chip active" onclick="window.setConsoleFilter('all', this)">[TODOS]</button>
                <button type="button" class="console-filter-chip chip-err" onclick="window.setConsoleFilter('error', this)">[ERRORES]</button>
                <button type="button" class="console-filter-chip chip-warn" onclick="window.setConsoleFilter('warn', this)">[WARN]</button>
                <button type="button" class="console-filter-chip chip-info" onclick="window.setConsoleFilter('info', this)">[INFO]</button>
            </div>
            <!-- Cuerpo de la consola CRT -->
            <div id="mobile-devtools-body" class="y2k-console-body"></div>
        </div>
    </div>

    <script>
        window.currentConsoleFilter = 'all';

        window.toggleDevConsole = function() {
            const m = document.getElementById('mobile-devtools-modal');
            if (!m) return;
            const isHidden = m.style.display === 'none';
            m.style.display = isHidden ? 'flex' : 'none';
            if (isHidden) {
                window.renderDevLogs();
                const dd = document.getElementById('chat-actions-dropdown');
                if (dd) dd.hidden = true;
            }
        };

        window.setConsoleFilter = function(filterType, btn) {
            window.currentConsoleFilter = filterType;
            const parent = btn.parentElement;
            if (parent) {
                parent.querySelectorAll('.console-filter-chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
            }
            window.renderDevLogs();
        };

        window.renderDevLogs = function() {
            const body = document.getElementById('mobile-devtools-body');
            const badgeToolbar = document.getElementById('mobile-err-badge');
            const badgeMenu = document.getElementById('mobile-err-badge-menu');
            if (!body) return;

            const logs = window.gajeDevLogs || [];
            let errCount = 0;
            const filter = window.currentConsoleFilter || 'all';

            const filteredLogs = logs.filter(l => {
                if (l.type === 'error') errCount++;
                if (filter === 'all') return true;
                return l.type === filter;
            });

            body.innerHTML = filteredLogs.map(l => {
                const rowClass = l.type === 'error' ? 'log-error' : (l.type === 'warn' ? 'log-warn' : 'log-info');
                const icon = l.type === 'error' ? '❌' : (l.type === 'warn' ? '⚠️' : 'ℹ️');
                return `<div class="console-log-row ${rowClass}">
                    <span class="console-log-time">[${l.time}]</span> ${icon} ${l.text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
                </div>`;
            }).join('');

            body.scrollTop = body.scrollHeight;

            const errStr = String(errCount);
            const showErr = errCount > 0;
            if (badgeToolbar) {
                badgeToolbar.textContent = errStr;
                badgeToolbar.style.display = showErr ? 'inline-flex' : 'none';
            }
            if (badgeMenu) {
                badgeMenu.textContent = errStr;
                badgeMenu.style.display = showErr ? 'inline-flex' : 'none';
            }
        };

        window.copyDevLogs = function() {
            const text = (window.gajeDevLogs || []).map(l => `[${l.time}] [${l.type.toUpperCase()}] ${l.text}`).join('\n');
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text);
                window.ChatUtils?.showToast ? window.ChatUtils.showToast('📋 Logs copiados al portapapeles', 'success', 2500) : alert('Logs copiados.');
            }
        };

        window.clearDevLogs = function() {
            window.gajeDevLogs = [];
            window.renderDevLogs();
            if (window.ChatUtils?.showToast) {
                window.ChatUtils.showToast('🧹 Consola de logs reiniciada', 'info', 2000);
            }
        };

        window.injectEruda = function() {
            if (window.eruda) {
                window.eruda.show();
                return;
            }
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/eruda';
            s.onload = function() {
                window.eruda.init();
                window.eruda.show();
            };
            document.body.appendChild(s);
        };
    </script>
</body>
</html>
