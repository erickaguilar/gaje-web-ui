<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="static/icons/gaje-icon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="description" content="GAJE Helix - Motor de inferencia nativo en Rust con compresión Q4_0 + FP32 (formato .gaje.flat v2 zero-copy mmap), Island Model .gmem y kernels SIMD de alto rendimiento.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GAJE Helix">
    <meta name="theme-color" content="#0a84ff">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="static/icons/gaje-icon.svg">
    <title>GAJE Helix | Genomic Semantic Compression Platform</title>
    <link rel="stylesheet" href="static/css/base.css?v=1.7.4">
    <link rel="stylesheet" href="static/css/chat.css?v=1.7.4">
    <link rel="stylesheet" href="static/css/sidebar.css?v=1.7.4">
    <link rel="stylesheet" href="static/css/messages.css?v=1.7.4">
    <link rel="stylesheet" href="static/css/toasts.css?v=1.7.4">
    <link rel="stylesheet" href="static/css/y2k-dark.css?v=1.7.4">
    <link rel="stylesheet" href="static/css/y2k-light.css?v=1.7.4">
    <link rel="stylesheet" href="static/css/y2k-zen.css?v=1.7.4">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <script src="static/js/bootstrap.js?v=1.7.4"></script>
</head>
<body>
    <div class="glow-bg-radial" aria-hidden="true"></div>
    <header id="gaje-header" class="y2k-header" data-page="chat"></header>

    <!-- Barra Lateral / Cajón Móvil de Sesiones e Historial (Modular) -->
    <aside id="chat-sidebar-drawer" class="sidebar-drawer" aria-label="Historial de Sesiones"></aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <div class="app-container">
        <main>
            <!-- Chat Principal con Componentes Modulares Dinámicos -->
            <section id="chat-view" class="chat-container" aria-label="Consola de Chat Genómico" aria-busy="false">
                <div id="chat-toolbar" class="chat-toolbar"></div>
                <div id="chat-window" class="chat-window" role="log" aria-live="polite" aria-relevant="additions" aria-labelledby="chat-label">
                    <div id="chat-starters" class="chat-starters"></div>
                </div>

                <button id="scroll-to-bottom-btn" class="scroll-to-bottom-btn" aria-label="Bajar al último mensaje" title="Bajar al final" hidden>
                    <svg class="y2k-icon" aria-hidden="true"><use href="static/icons/y2k/sprite.svg#i-arrow-down"/></svg>
                </button>

                <div id="chat-input-area" class="input-area"></div>
            </section>
        </main>
    </div>

    <footer id="gaje-footer" class="y2k-footer"></footer>
    <script src="static/js/config.js"></script>
    <script src="static/js/storage.js"></script>
    <script src="static/js/ui.js"></script>

    <!-- Módulos de la Consola de Chat -->
    <script src="static/js/chat/state.js?v=1.7.4"></script>
    <script src="static/js/chat/utils.js?v=1.7.4"></script>
    <script src="static/js/chat/markdown.js?v=1.7.4"></script>
    <script src="static/js/chat/storage.js?v=1.7.4"></script>
    <script src="static/js/chat/sidebar.js?v=1.7.4"></script>
    <script src="static/js/chat/toolbar.js?v=1.7.4"></script>
    <script src="static/js/chat/model_loader.js?v=1.7.4"></script>
    <script src="static/js/chat/engine.js?v=1.7.4"></script>
    <script src="static/js/chat/composer.js?v=1.7.4"></script>
    <script src="static/js/chat/telemetry.js?v=1.7.4"></script>
    <script src="static/js/chat/devtools.js?v=1.7.4"></script>
    <script src="static/js/chat/index.js?v=1.7.4"></script>
</body>
</html>
